spring:
  application:
    name: pavitra-ristaa
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pavitra_ristaa}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        globally_quoted_identifiers: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pavitra:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: pavitra-ristaa
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
      remember-me-refresh-token-ttl: P90D
  media:
    provider: ${MEDIA_PROVIDER:S3}
    bucket: ${MEDIA_BUCKET:}
    region: ${MEDIA_REGION:us-east-1}
    endpoint: ${MEDIA_ENDPOINT:}
    access-key: ${MEDIA_ACCESS_KEY:}
    secret-key: ${MEDIA_SECRET_KEY:}
    path-style-access: ${MEDIA_PATH_STYLE:false}
    upload-url-ttl: PT10M
    download-url-ttl: PT1H
    max-file-size-bytes: 10485760
    allowed-mime-types: image/jpeg,image/png,image/webp
  otp:
    ttl: PT10M
    length: 6
    max-attempts: 5
  auth:
    max-failed-logins: 5
    lock-duration: PT15M
    password-min-length: 8
    min-age-years: 18
    oauth:
      google-client-id: ${GOOGLE_CLIENT_ID:}
      apple-client-id: ${APPLE_CLIENT_ID:}
      apple-issuer: https://appleid.apple.com
  razorpay:
    # Blank key-id (the default everywhere until this is set) is how PaymentGatewayConfig picks the stub
    # gateway instead of the real one - see its class comment.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  cors:
    # Comma-separated list of exact origins a browser frontend is served from - no wildcard, since JWTs are
    # sent as a bearer header rather than a cookie but the allowlist should still stay explicit. Add the
    # deployed frontend's real origin here once it has one; local dev already covers Vite/CRA's default ports.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
