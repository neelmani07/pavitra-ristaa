spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pavitra_ristaa}
    username: ${DB_USERNAME:pavitra_ristaa}
    password: ${DB_PASSWORD:}

pavitra:
  security:
    jwt:
      # No placeholder fallback: JwtSecretValidator now rejects a short/blank/placeholder secret in every
      # profile. Run ./scripts/setup-local.sh once to generate a real one into .env.
      secret: ${JWT_SECRET}
  media:
    # Local MinIO by default; MEDIA_ACCESS_KEY / MEDIA_SECRET_KEY must come from the environment.
    provider: ${MEDIA_PROVIDER:MINIO}
    bucket: ${MEDIA_BUCKET:pavitra-media}
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    path-style-access: ${MEDIA_PATH_STYLE:true}

logging:
  level:
    com.pavitraristaa: DEBUG
    org.springframework.security: INFO
