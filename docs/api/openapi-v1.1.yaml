components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'
        timestamp:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        age:
          type: integer
        gender:
          type: string
        location:
          type: object
          additionalProperties: true
        primaryPhoto:
          type: string
          format: uri
        relationshipModes:
          type: array
          description: User relationship intent(s). These modes do not create separate compatibility parameter sets.
          items:
            type: string
        verified:
          type: boolean
    SpiritualProfile:
      type: object
      description: Optional lightweight spiritual information attached 1:1 to a user profile.
      properties:
        spiritualCommunity:
          type: string
          nullable: true
        spiritualInterests:
          type: string
          nullable: true
        practices:
          type: string
          nullable: true
        anySpiritualProfession:
          type: string
          nullable: true
        dreamSpiritualPilgrimageDestination:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateSpiritualProfileRequest:
      type: object
      description: All fields are optional. Send null to clear an existing value.
      properties:
        spiritualCommunity:
          type: string
          nullable: true
        spiritualInterests:
          type: string
          nullable: true
        practices:
          type: string
          nullable: true
        anySpiritualProfession:
          type: string
          nullable: true
        dreamSpiritualPilgrimageDestination:
          type: string
          nullable: true
    SpiritualSearchFilter:
      type: object
      description: Optional text-based spirituality filters for discovery.
      properties:
        spiritualCommunity:
          type: string
        spiritualInterest:
          type: string
        practice:
          type: string
        anySpiritualProfession:
          type: string
    DiscoverySearchRequest:
      type: object
      description: Discovery filters. Known filters are defined below; additional filters may be added without breaking the contract.
      properties:
        query:
          type: string
        relationshipModes:
          type: array
          items:
            type: string
        minAge:
          type: integer
        maxAge:
          type: integer
        countryId:
          type: integer
        stateId:
          type: integer
        cityId:
          type: integer
        spiritual:
          $ref: '#/components/schemas/SpiritualSearchFilter'
      additionalProperties: true
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
