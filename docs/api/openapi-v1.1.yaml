openapi: 3.0.3
info:
  title: Relationship Platform API
  version: 1.1.0
  description: 'Product-facing REST API contract for the MVP: Dating/Love + Friendship
    + Marriage. Contract aligned to the v1.1 schema: one shared partner-preference and
    compatibility model across all relationship modes, plus one optional lightweight
    spiritual profile. Community and analytics features not represented in the MVP
    schema are explicitly marked as deferred or decision-required in the accompanying
    decisions document.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development
- url: https://dev-api.example.com/api/v1
  description: Development/staging placeholder
tags:
- name: Authentication
- name: Profile
- name: Relationship Modes
- name: Master Data
- name: Partner Preferences
- name: Discovery
- name: Favorites
- name: Connections
- name: Messaging
- name: Notifications
- name: Media
- name: Trust & Safety
- name: Subscription & Payments
- name: Settings & Privacy
- name: Support
- name: Admin
- name: Analytics & Growth
paths:
  /auth/register:
    post:
      summary: Register a new account
      tags:
      - Authentication
      description: At least one verified contact method is required. Minimum age,
        terms/privacy acceptance and uniqueness rules are enforced by the product
        contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                email:
                  type: string
                  format: email
                mobile:
                  type: string
                password:
                  type: string
                  format: password
                referralCode:
                  type: string
                inviteCode:
                  type: string
                acceptedTerms:
                  type: boolean
                acceptedPrivacyPolicy:
                  type: boolean
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/verify-otp:
    post:
      summary: Verify an OTP
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destination
              - otp
              - purpose
              properties:
                destination:
                  type: string
                otp:
                  type: string
                purpose:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/resend-otp:
    post:
      summary: Resend an OTP
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destination
