  /me/profile:
    get:
      summary: Get my complete profile
      tags:
      - Profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
