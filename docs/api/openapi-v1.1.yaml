  /me/profile/spiritual:
    get:
      summary: Get my spiritual profile
      tags:
      - Profile
      security:
      - bearerAuth: []
      description: Returns the optional lightweight spiritual profile. If the user has not provided spiritual information, data may be null.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/SpiritualProfile'
                      nullable: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      summary: Replace my spiritual profile
      tags:
      - Profile
      security:
      - bearerAuth: []
      description: Creates or replaces the optional spiritual profile. All user-entered fields are optional and nullable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpiritualProfileRequest'
      responses:
        '200':
          description: Successful response
          content:
