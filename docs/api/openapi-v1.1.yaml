  /auth/sessions:
    get:
      summary: List active sessions
      tags:
      - Authentication
      security:
      - bearerAuth: []
      parameters: &id001
      - &id002
        name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id003
        name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id004
        name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Conversation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/sessions/{sessionId}:
    delete:
      summary: Revoke a specific session
      tags:
      - Authentication
      security:
      - bearerAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
