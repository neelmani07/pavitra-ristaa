      tags:
      - Profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                displayName:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                gender:
                  type: string
                headline:
                  type: string
                aboutMe:
                  type: string
                countryId:
                  type: integer
                stateId:
                  type: integer
                cityId:
                  type: integer
